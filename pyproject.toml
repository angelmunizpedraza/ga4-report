[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4-report"
version = "0.2.0"
description = "Organic traffic reporting straight from the GA4 API, with period comparison and per-landing-page alerts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ángel Muñiz Pedraza", email = "angelhd029@gmail.com" }]
keywords = ["ga4", "analytics", "seo", "reporting", "organic-traffic", "n8n"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.31.0", "google-auth>=2.29.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/angelmunizpedraza/ga4-report"
Issues = "https://github.com/angelmunizpedraza/ga4-report/issues"

[project.scripts]
ga4-report = "ga4_report.__main__:main"

[tool.setuptools.packages.find]
include = ["ga4_report*"]
